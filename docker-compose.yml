services:
  mysql:
    image: mariadb:10.11
    container_name: tpi-eg-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: consultas_materias
      MYSQL_USER: tpi
      MYSQL_PASSWORD: tpi
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed_demo.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - tpi_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./docker/php-apache
    container_name: tpi-eg-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./ModuloAvisoDeConsultas:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  tpi_mysql_data:
